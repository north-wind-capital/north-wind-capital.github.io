name: Enable GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages for Actions deployment
        env:
          GH_TOKEN: ${{ secrets.PAGES_SETUP_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.https_enforced')" != "true" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -F https_enforced=true
          fi
